[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppgs-watermark"
version = "0.1.0"
description = "Reference implementation of Proportion-Preserved Gaussian Shading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
diffusion = [
  "accelerate>=1.14,<1.15",
  "diffusers>=0.40,<0.41",
  "pillow>=9.0",
  "torch>=2.10,<2.11",
  "transformers>=5.15,<5.16",
]
evaluation = ["pillow>=9.0"]
quality = ["open-clip-torch>=3.3,<3.4", "torchvision>=0.25,<0.26"]
test = ["pillow>=9.0", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
